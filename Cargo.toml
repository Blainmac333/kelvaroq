[workspace]
members = ["native/kelvaroq-render"]
default-members = [".", "native/kelvaroq-render"]
resolver = "3"

[package]
name = "kelvaroq"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-or-later"
default-run = "kelvaroq"
description = "An experimental console compatibility runtime for Windows x64"

[lib]
name = "kelvaroq_simd"
path = "src/simd.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
goblin = "0.10"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
